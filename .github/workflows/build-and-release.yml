name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '[0-9]+.*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (e.g. v0.1.6)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglew-dev \
            libglfw3-dev \
            libusb-1.0-0-dev \
            libgl1-mesa-dev \
            inkscape \
            python3-pil \
            file

      - name: Generate assets and application icons
        run: |
          python3 generate_assets.py

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build MixiD
        run: |
          cmake --build build -j$(nproc)

      - name: Package with CPack (DEB & TGZ)
        run: |
          cd build
          cpack
          ls -lh id-mixer*

      - name: Generate SHA-256 Checksums
        run: |
          cd build
          sha256sum id-mixer_*.deb id-mixer-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: id-mixer-packages
          path: |
            build/id-mixer_*.deb
            build/id-mixer-*.tar.gz
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.6-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: iD Mixer ${{ steps.release_info.outputs.tag }}
          files: |
            build/id-mixer_*.deb
            build/id-mixer-*.tar.gz
            build/SHA256SUMS.txt
          body: |
            ## iD Mixer Release ${{ steps.release_info.outputs.tag }}

            Unofficial Linux mixer and control panel for Audient iD series audio interfaces.

            ### Attribution & Notes
            - **Original Author**: Created by [@TheOnlyJoey](https://github.com/TheOnlyJoey/MixiD) (Joey Ferweda).
            - **Packaging & Tweaks**: Packaged with desktop integration, custom icons, udev rules, and CI/CD releases by [@subigyanpaudel](https://github.com/subigyanpaudel/MixiD).
            - Maintained with ongoing tweaks and testing on Linux systems.

            ### Quick Installation:
            **Debian / Ubuntu / Mint (.deb)**:
            ```bash
            sudo apt install ./id-mixer_*_amd64.deb
            # or
            sudo dpkg -i id-mixer_*_amd64.deb && sudo apt-get install -f
            ```

            **Other Linux distributions (.tar.gz)**:
            Extract `id-mixer-*-Linux.tar.gz` and run `usr/local/bin/MixiD` or copy files to your system prefix.
          generate_release_notes: true
          draft: false
          prerelease: false
